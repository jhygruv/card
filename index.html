<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="dark light" />
    <title>웹 명함 | 양진환</title>
    <meta
      name="description"
      content="양진환의 웹 명함 — 초보 개발자. 연락처: ooooo@ooooo.com / 010-0000-0000"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./style.css" />
    <script defer src="./script.js"></script>
  </head>
  <body>
    <main class="wrap">
      <section class="card" aria-label="웹 명함">
        <header class="top">
          <div class="avatar" aria-hidden="true">
            <svg
              class="avatarSvg"
              viewBox="0 0 200 200"
              width="200"
              height="200"
              role="img"
              aria-label="캐릭터 얼굴 일러스트"
            >
              <defs>
                <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
                  <stop offset="0" stop-color="var(--a1)" />
                  <stop offset="1" stop-color="var(--a2)" />
                </linearGradient>
                <linearGradient id="hairGrad" x1="0" y1="0" x2="0" y2="1">
                  <stop offset="0" stop-color="#1f2937" />
                  <stop offset="1" stop-color="#0b1220" />
                </linearGradient>
                <radialGradient id="shine" cx="30%" cy="25%" r="65%">
                  <stop offset="0" stop-color="#ffffff" stop-opacity="0.18" />
                  <stop offset="1" stop-color="#ffffff" stop-opacity="0" />
                </radialGradient>
                <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
                  <feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#000" flood-opacity="0.22" />
                </filter>
              </defs>

              <!-- background -->
              <g filter="url(#softShadow)">
                <circle cx="100" cy="100" r="92" fill="url(#bgGrad)" />
              </g>
              <circle cx="100" cy="100" r="92" fill="url(#shine)" />

              <!-- neck -->
              <path
                d="M86 142 C88 158, 112 158, 114 142 L114 132 C112 128, 88 128, 86 132 Z"
                fill="#f2c7a8"
                opacity="0.98"
              />

              <!-- face -->
              <ellipse cx="100" cy="106" rx="44" ry="48" fill="#f6cfb2" />
              <path d="M66 112 C72 140, 128 140, 134 112" fill="#efb99a" opacity="0.22" />

              <!-- hair -->
              <path
                d="M58 98 C52 66, 72 44, 100 44 C130 44, 150 66, 142 98
                   C130 78, 112 76, 100 76 C86 76, 70 80, 58 98 Z"
                fill="url(#hairGrad)"
              />
              <path
                d="M68 63 C80 52, 95 50, 100 50 C122 50, 136 64, 140 78
                   C124 68, 112 66, 100 66 C88 66, 76 68, 68 74 Z"
                fill="#0b1220"
                opacity="0.55"
              />

              <!-- ears -->
              <ellipse cx="58" cy="110" rx="8" ry="12" fill="#f3c8aa" />
              <ellipse cx="142" cy="110" rx="8" ry="12" fill="#f3c8aa" />

              <!-- eyes -->
              <g>
                <ellipse cx="84" cy="108" rx="12" ry="10" fill="#ffffff" opacity="0.95" />
                <ellipse cx="116" cy="108" rx="12" ry="10" fill="#ffffff" opacity="0.95" />
                <circle cx="88" cy="110" r="5.6" fill="#0b1220" />
                <circle cx="120" cy="110" r="5.6" fill="#0b1220" />
                <circle cx="90" cy="108.5" r="2" fill="#ffffff" opacity="0.9" />
                <circle cx="122" cy="108.5" r="2" fill="#ffffff" opacity="0.9" />
                <path d="M72 104 C78 96, 94 96, 98 104" fill="none" stroke="#0b1220" stroke-width="3" stroke-linecap="round" opacity="0.7" />
                <path d="M102 104 C106 96, 122 96, 128 104" fill="none" stroke="#0b1220" stroke-width="3" stroke-linecap="round" opacity="0.7" />
              </g>

              <!-- nose -->
              <path d="M100 112 C96 120, 96 122, 100 124 C104 122, 104 120, 100 112 Z" fill="#eaa987" opacity="0.55" />

              <!-- mouth -->
              <path d="M84 134 C92 144, 108 144, 116 134" fill="none" stroke="#0b1220" stroke-width="4" stroke-linecap="round" opacity="0.65" />
              <path d="M86 132 C92 138, 108 138, 114 132" fill="none" stroke="#f472b6" stroke-width="5" stroke-linecap="round" opacity="0.12" />

              <!-- hoodie -->
              <path
                d="M54 180 C64 154, 78 146, 100 146 C122 146, 136 154, 146 180
                   L146 200 L54 200 Z"
                fill="#0b1220"
                opacity="0.92"
              />
              <path d="M78 150 C82 166, 118 166, 122 150" fill="none" stroke="#93c5fd" stroke-width="4" opacity="0.55" stroke-linecap="round" />
            </svg>
          </div>

          <div class="headline">
            <p class="badge" id="badge">Available</p>
            <h1 class="name">양진환</h1>
            <p class="role">초보 개발자</p>
            <p class="intro">배우는 속도를 실력으로 바꾸는 중.</p>
          </div>
        </header>

        <div class="divider" role="presentation"></div>

        <section class="info" aria-label="연락처">
          <div class="row">
            <div class="label">Email</div>
            <a class="value link" href="mailto:ooooo@ooooo.com" data-copy="ooooo@ooooo.com"
              >ooooo@ooooo.com</a
            >
            <button class="copy" type="button" data-copy-btn="ooooo@ooooo.com" aria-label="이메일 복사">
              복사
            </button>
          </div>
          <div class="row">
            <div class="label">Phone</div>
            <a class="value link" href="tel:01000000000" data-copy="010-0000-0000">010-0000-0000</a>
            <button class="copy" type="button" data-copy-btn="010-0000-0000" aria-label="전화번호 복사">
              복사
            </button>
          </div>
          <div class="row">
            <div class="label">Office</div>
            <a
              class="value link"
              href="https://naver.me/xmxIspvi"
              target="_blank"
              rel="noopener noreferrer"
              data-copy="https://naver.me/xmxIspvi"
              >사무실 위치 (네이버 지도)</a
            >
            <button
              class="copy"
              type="button"
              data-copy-btn="https://naver.me/xmxIspvi"
              aria-label="사무실 위치 링크 복사"
            >
              복사
            </button>
          </div>
        </section>

        <footer class="footer">
          <button class="primary" type="button" id="toggleStatus">
            상태 토글
          </button>
          <button class="ghost" type="button" id="copyAll">
            연락처 한 번에 복사
          </button>
          <p class="hint" id="hint" aria-live="polite"></p>
        </footer>
      </section>
    </main>
  </body>
</html>
